<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Golden Rock</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: system-ui, sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      /* Custom "brush" cursor while drawing; grab cursor while orbiting. */
      body.draw #app {
        cursor: crosshair;
      }
      body.orbit #app {
        cursor: grab;
      }
      body.orbit #app:active {
        cursor: grabbing;
      }

      /* Draw-mode border glow: a pulsing frame so it's unmistakable you're painting. */
      #drawFrame {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 2;
        opacity: 0;
        border: 2px solid rgba(230, 190, 120, 0.85);
        box-shadow:
          inset 0 0 60px rgba(200, 150, 60, 0.22),
          inset 0 0 12px rgba(230, 190, 120, 0.4);
        transition: opacity 0.25s ease;
      }
      body.draw #drawFrame {
        opacity: 1;
        animation: framePulse 2.4s ease-in-out infinite;
      }
      @keyframes framePulse {
        0%,
        100% {
          opacity: 0.55;
        }
        50% {
          opacity: 1;
        }
      }

      .fatal {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        color: #ff8a80;
        background: rgba(20, 8, 8, 0.85);
        padding: 16px 22px;
        border-radius: 10px;
        font-size: 14px;
        max-width: 480px;
        z-index: 6;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="drawFrame"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
