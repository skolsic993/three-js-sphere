<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Golden Rock</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: system-ui, sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      /* Custom "brush" cursor while drawing; grab cursor while orbiting. */
      body.draw #app {
        cursor: crosshair;
      }
      body.orbit #app {
        cursor: grab;
      }
      body.orbit #app:active {
        cursor: grabbing;
      }

      /* Draw-mode border glow: a pulsing violet frame so it's unmistakable you're painting. */
      #drawFrame {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 2;
        opacity: 0;
        border: 2px solid rgba(190, 140, 255, 0.9);
        box-shadow:
          inset 0 0 60px rgba(150, 90, 240, 0.3),
          inset 0 0 12px rgba(190, 140, 255, 0.45);
        transition: opacity 0.25s ease;
      }
      body.draw #drawFrame {
        opacity: 1;
        animation: framePulse 2.4s ease-in-out infinite;
      }
      @keyframes framePulse {
        0%,
        100% {
          opacity: 0.55;
        }
        50% {
          opacity: 1;
        }
      }

      /* Clickable mode pill (bottom-center) — the primary, obvious mode switch. */
      #modeBtn {
        position: fixed;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        z-index: 4;
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        user-select: none;
        padding: 9px 16px 9px 12px;
        border-radius: 999px;
        font-size: 13.5px;
        font-weight: 600;
        color: #17081f;
        background: linear-gradient(180deg, #dfc2ff, #b287f0);
        border: none;
        box-shadow:
          0 6px 20px rgba(0, 0, 0, 0.35),
          0 0 0 4px rgba(190, 140, 255, 0.14);
        transition:
          transform 0.12s ease,
          box-shadow 0.2s ease;
      }
      #modeBtn:hover {
        transform: translateX(-50%) translateY(-1px);
      }
      #modeBtn:active {
        transform: translateX(-50%) translateY(1px);
      }
      #modeBtn .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #2a1240;
        box-shadow: 0 0 8px #2a1240;
      }
      #modeBtn .key {
        margin-left: 2px;
        padding: 2px 7px;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 700;
        background: rgba(23, 8, 31, 0.22);
        color: #2a1240;
      }
      /* Orbit mode: pill goes calm/blue so the current state reads at a glance. */
      body.orbit #modeBtn {
        color: #dbe7f5;
        background: rgba(24, 28, 40, 0.85);
        box-shadow:
          0 6px 20px rgba(0, 0, 0, 0.4),
          0 0 0 1px rgba(130, 150, 200, 0.25);
      }
      body.orbit #modeBtn .dot {
        background: #6ea8ff;
        box-shadow: 0 0 8px #6ea8ff;
      }
      body.orbit #modeBtn .key {
        background: rgba(255, 255, 255, 0.1);
        color: #dbe7f5;
      }

      #toast {
        display: none;
        position: fixed;
        left: 50%;
        top: 64px;
        transform: translateX(-50%) translateY(-8px);
        z-index: 5;
        padding: 8px 16px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 600;
        color: #efe2ff;
        background: rgba(38, 18, 58, 0.9);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.3s ease,
          transform 0.3s ease;
      }
      #toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      .fatal {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        color: #ff8a80;
        background: rgba(20, 8, 8, 0.85);
        padding: 16px 22px;
        border-radius: 10px;
        font-size: 14px;
        max-width: 480px;
        z-index: 6;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="drawFrame"></div>
    <div id="toast"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
